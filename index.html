<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Website — Embedded Community Chat</title>
  <style>
    body { margin: 0; font: 16px/1.6 system-ui, sans-serif; background: #f4f6fa; color: #172033; }
    main { max-width: 760px; margin: 5rem auto; padding: 0 24px; }
    .panel { padding: 20px; background: white; border: 1px solid #dae1ed; border-radius: 12px; }
  </style>
  <!-- The only line needed to add the chat widget to this page: -->
  <script src="chat/embed.js" defer></script>
</head>
<body>
  <main>
    <h1>My Website</h1>
    <div class="panel">
      <p>This is a completely separate HTML page.</p>
      <p>The chat is loaded from the <code>chat/</code> folder using a single script tag.</p>
      <p>Open the chat button in the bottom-right corner to try it.</p>
    </div>
  </main>
</body>
</html>
